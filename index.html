<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TP1 - Todo-list MVVM</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
      }
      .done {
        text-decoration: line-through;
        color: #888;
      }
      .error {
        color: #c8483f;
      }
      .filters {
        display: flex;
        gap: 8px;
        margin: 16px 0;
      }
      .filters .actif {
        background: #245b4a;
        border-color: #245b4a;
        color: white;
      }
      li {
        margin: 6px 0;
      }
    </style>
  </head>
  <body>
    <h1>Todo-list (MVVM)</h1>
    <div id="app">
      <form>
        <input placeholder="Nouvelle tâche" autofocus /> <button>Ajouter</button>
      </form>
      <nav class="filters" aria-label="Filtres des tâches">
        <button type="button" data-filtre="toutes" aria-pressed="false">Toutes</button>
        <button type="button" data-filtre="faites" aria-pressed="false">Faites</button>
        <button type="button" data-filtre="a-faire" aria-pressed="false">À faire</button>
      </nav>
      <p class="error"></p>
      <ul></ul>
      <p class="counter"></p>
    </div>
    <script type="module">
      import { TodoModel } from './TodoModel.js';
      import { TodoView } from './TodoView.js';
      import { TodoViewModel } from './TodoViewModel.js';
      const viewModel = new TodoViewModel(new TodoModel());
      new TodoView(document.getElementById('app')).bind(viewModel);
    </script>
  </body>
</html>
